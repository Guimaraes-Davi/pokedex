<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos</title>
    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #1a1a2e;
            color: #eee;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 { color: #e63946; font-size: 2.5rem; margin-bottom: 30px; }  

        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background-color: #e63946;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background-color: #c1121f; }

        .favorito {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        @media (max-width: 600px) {
            #lista { flex-direction: column; align-items: center; }
            #lista > div { width: 85% !important; }
        }

    </style>
</head>
<body>
    
    <div class="favorito">
        <h1>Meus Favoritos</h1> 
        <a href="/"><button>Voltar</button></a>
    </div>

    <div id="lista" style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;"></div>

    <script>
        async function carregarFavoritos() {
            const resposta = await fetch("/favoritos");
            const favoritos = await resposta.json();
            const lista = document.getElementById("lista");

            if (favoritos.length === 0) {
                lista.innerHTML = "<p>Nenhum favorito ainda.</p>";
                return;
            }

            lista.innerHTML = favoritos.map(pokemon => `
                <div style="background:#16213e; border-radius:16px; padding:20px; text-align:center; width:220px;">
                    <img src="${pokemon.imagem}" style="width:120px;" />
                    <h2 style="text-transform:capitalize; margin:10px 0;">${pokemon.nome}</h2>
                    <p style="color:#aaa;">${pokemon.tipos}</p>
                    <button onclick="remover(${pokemon.id})" style="margin-top:12px; background:#e63946;">🗑 Remover</button>
                </div>
            `).join("");
        }

        async function remover(id) {
            await fetch(`/favoritos/${id}`, { method: "DELETE" });
            carregarFavoritos();
        }

        carregarFavoritos();
    </script>


</body>
</html>
